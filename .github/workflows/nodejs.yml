name: TaskFlow API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Node.js and npm
        run: |
          node --version
          npm --version

      - name: Start TaskFlow API
        env:
          PORT: 5000
          MONGO_URI: mongodb://127.0.0.1:27017/taskflow_test
          JWT_SECRET: ci_test_secret_for_taskflow_api
          JWT_EXPIRES_IN: 1h
        run: |
          nohup npm start > taskflow.log 2>&1 &

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/ > /dev/null; then
              echo "TaskFlow API is running."
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:5000/

      - name: Test register
        run: |
          curl -fsS -X POST http://127.0.0.1:5000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Test User","email":"ci-test@example.com","password":"TestPass123!"}' \
            -o register.json

          cat register.json

      - name: Test login
        run: |
          curl -fsS -X POST http://127.0.0.1:5000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-test@example.com","password":"TestPass123!"}' \
            -o login.json

          cat login.json

          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('login.json')); if(!data.token) process.exit(1); fs.writeFileSync('token.txt', data.token);"

      - name: Test protected /me route
        run: |
          TOKEN=$(cat token.txt)

          curl -fsS http://127.0.0.1:5000/api/auth/me \
            -H "Authorization: Bearer $TOKEN" \
            -o me.json

          cat me.json

      - name: Show API logs if a test fails
        if: failure()
        run: cat taskflow.log
